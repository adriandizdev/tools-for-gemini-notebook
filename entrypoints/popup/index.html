<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>NotebookLM Tools</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>NotebookLM Tools</h1>
    </header>

    <main>
      <section id="export-section" hidden>
        <label class="option">
          <input type="checkbox" id="include-user" checked />
          Incluir mensajes del usuario
        </label>
        <button id="export" class="primary">Exportar conversación a PDF</button>
      </section>

      <section id="add-section" hidden>
        <form id="notebook-form">
          <label for="notebook">Cuaderno</label>
          <select id="notebook" required></select>
          <button id="add" class="primary" type="submit" disabled>Añadir a cuaderno</button>
        </form>
      </section>

      <section id="documents-section" hidden>
        <button id="grant" class="primary" hidden>Permitir buscar documentos</button>
        <div id="documents" hidden>
          <label for="documents-notebook">Cuaderno</label>
          <select id="documents-notebook"></select>
          <p id="scan-status" role="status" hidden></p>
          <ul id="document-list"></ul>
          <button id="add-selected" class="primary" disabled>Añadir seleccionados</button>
        </div>
      </section>

      <footer>
        <p id="status" role="status"></p>
      </footer>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
